<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AERO ALIEN WAR - PAF Project by Hadi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#010111;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;color:#fff;font-family:Arial, sans-serif}#game{position:relative;width:100%;max-width:420px;height:100vh;background:radial-gradient(ellipse at center, #0f0f3a 0%, #020210 100%);overflow:hidden;border:2px solid #00f5ff33}canvas{width:100%;height:100%;display:block}#ui{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);font-weight:900;font-size:14px}#ui span{color:#00f5ff}#healthWrap{position:absolute;top:42px;left:10px;right:10px;height:10px;background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;z-index:10;border:1px solid #ffffff22}#healthFill{height:100%;width:100%;background:linear-gradient(90deg, #00ff88, #00f5ff);transition:width 0.3s;box-shadow:0 0 10px #00ff88}#center{position:absolute;inset:0;z-index:20;background:rgba(2,2,16,0.93);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}#center h1{font-size:28px;text-shadow:0 0 20px #00f5ff;letter-spacing:2px}#center h1 b{color:#00f5ff;display:block;font-size:42px;margin-top:5px}#center p{margin:15px 0;color:#aaffff;font-size:13px}.btn{background:linear-gradient(90deg, #0033aa, #00f5ff);border:none;color:#fff;padding:16px 40px;border-radius:30px;font-weight:900;font-size:17px;box-shadow:0 0 30px #00f5ff;cursor:pointer;margin-top:15px}#credit{margin-top:20px;font-size:11px;color:#ffffff66}
</style>
</head>
<body>
<div id="game">
<div id="ui"><div>SCORE:<span id="score">0</span> LVL:<span id="level">1</span></div><div>KILLS:<span id="kills">0</span></div></div>
<div id="healthWrap"><div id="healthFill"></div></div>
<canvas id="cv"></canvas>
<div id="center">
<h1>AERO<b>ALIEN WAR</b></h1>
<p>PAF Thunder Defender<br>DRAG TO MOVE | AUTO FIRE | INFINITE LEVELS<br><br>Made by Hadi for Science Project</p>
<button class="btn" onclick="startGame()">START MISSION 🚀</button>
<div class="credit">PAF - Pakistan Air Force Project</div>
</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),game=document.getElementById('game');let W,H,scale=2;function resize(){W=game.clientWidth;H=game.clientHeight;cv.width=W*scale;cv.height=H*scale;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(scale,0,0,scale,0,0);}resize();window.onresize=resize;let running=false,score=0,level=1,kills=0,health=100,sensitivity=1.2,plane={x:0,y:0,w:56,h:68},bullets=[],aliens=[],particles=[],stars=[],lastShot=0,lastSpawn=0,drag={active:false,sx:0,sy:0,px:0,py:0};function initStars(){stars=[];for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,sp:Math.random()*1.8+0.4})}function startGame(){document.getElementById('center').style.display='none';running=true;score=0;kills=0;health=100;level=1;bullets=[];aliens=[];particles=[];plane.x=W/2-28;plane.y=H-150;initStars();updateUI();requestAnimationFrame(loop);}function updateUI(){document.getElementById('score').innerText=score;document.getElementById('level').innerText=level;document.getElementById('kills').innerText=kills;document.getElementById('healthFill').style.width=health+'%';if(health<30)document.getElementById('healthFill').style.background='linear-gradient(90deg, #ff0000, #ff8800)';else document.getElementById('healthFill').style.background='linear-gradient(90deg, #00ff88, #00f5ff)';}function spawnAlien(){let a={x:Math.random()*(W-40),y:-50,w:38,h:34,vy:1.8+level*0.35+Math.random()*1.2};aliens.push(a);}function shoot(){let now=Date.now();if(now-lastShot<150)return;lastShot=now;bullets.push({x:plane.x+plane.w/2-2,y:plane.y,vy:-13});if(level>=2){bullets.push({x:plane.x+6,y:plane.y+12,vy:-11});bullets.push({x:plane.x+plane.w-10,y:plane.y+12,vy:-11});}}function explode(x,y,c){for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:1,decay:0.04+Math.random()*0.03,color:c});}function loop(){if(!running)return;ctx.clearRect(0,0,W,H);for(let s of stars){s.y+=s.sp;if(s.y>H){s.y=-5;s.x=Math.random()*W}ctx.fillStyle='#ffffff';ctx.globalAlpha=s.s/2;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(score>=level*400){level++;health=Math.min(100,health+25);updateUI();}shoot();let now=Date.now();if(now-lastSpawn>Math.max(220,750-level*55)){spawnAlien();lastSpawn=now;}ctx.save();ctx.translate(plane.x+plane.w/2,plane.y+plane.h/2);ctx.fillStyle='#1a2a4a';ctx.beginPath();ctx.moveTo(0,-32);ctx.lineTo(-15,24);ctx.lineTo(-6,32);ctx.lineTo(6,32);ctx.lineTo(15,24);ctx.closePath();ctx.fill();ctx.fillStyle='#00f5ff';ctx.fillRect(-2.5,-30,5,28);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(0,32,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(0,32,3,0,Math.PI*2);ctx.fill();ctx.restore();for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.y+=b.vy;ctx.fillStyle='#aaffff';ctx.shadowColor='#00f5ff';ctx.shadowBlur=10;ctx.fillRect(b.x,b.y,4,16);ctx.shadowBlur=0;if(b.y<0)bullets.splice(i,1);}for(let i=aliens.length-1;i>=0;i--){let a=aliens[i];a.y+=a.vy;ctx.fillStyle='#ffaa00';ctx.shadowColor='#ffaa00';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(a.x+a.w/2,a.y+a.h/2,a.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#552200';ctx.beginPath();ctx.arc(a.x+a.w/2-4,a.y+a.h/2-2,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(a.x+a.w/2+5,a.y+a.h/2-1,3,0,Math.PI*2);ctx.fill();if(a.y>H){aliens.splice(i,1);health-=12;updateUI();if(health<=0)gameOver();continue;}if(a.y+a.h>plane.y&&a.x<plane.x+plane.w&&a.x+a.w>plane.x&&a.y<plane.y+plane.h){explode(plane.x+plane.w/2,plane.y+15,'#ffffff');aliens.splice(i,1);health-=18;updateUI();if(health<=0)gameOver();continue;}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(b.x>a.x&&b.x<a.x+a.w&&b.y>a.y&&b.y<a.y+a.h){bullets.splice(j,1);aliens.splice(i,1);score+=25;kills++;updateUI();explode(a.x+a.w/2,a.y+a.h/2,'#ffaa00');break;}}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue;}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}requestAnimationFrame(loop);}function gameOver(){running=false;document.getElementById('center').innerHTML=`<h1 style="color:#ff4444">GAME OVER</h1><p style="font-size:18px;margin:15px 0">Score: ${score}<br>Level: ${level}<br>Kills: ${kills}</p><button class=btn onclick=location.reload()>PLAY AGAIN</button><div class=credit>PAF Project - Hadi</div>`;document.getElementById('center').style.display='flex';}function onDown(x,y){drag.active=true;drag.sx=x;drag.sy=y;drag.px=plane.x;drag.py=plane.y;}function onMove(x,y){if(!drag.active||!running)return;let dx=(x-drag.sx)*sensitivity,dy=(y-drag.sy)*sensitivity;plane.x=Math.max(0,Math.min(W-plane.w,drag.px+dx));plane.y=Math.max(45,Math.min(H-plane.h-5,drag.py+dy));}function onUp(){drag.active=false;}cv.addEventListener('touchstart',e=>{let r=game.getBoundingClientRect();onDown(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);},{passive:false});cv.addEventListener('touchmove',e=>{let r=game.getBoundingClientRect();onMove(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);e.preventDefault();},{passive:false});cv.addEventListener('touchend',onUp);cv.addEventListener('mousedown',e=>{let r=game.getBoundingClientRect();onDown(e.clientX-r.left,e.clientY-r.top);});window.addEventListener('mousemove',e=>{let r=game.getBoundingClientRect();onMove(e.clientX-r.left,e.clientY-r.top);});window.addEventListener('mouseup',onUp);
</script>
</body>
</html>
